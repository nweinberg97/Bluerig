# Publishes to GitHub Pages:
#   https://nweinberg97.github.io/Bluerig/        the landing page
#   https://nweinberg97.github.io/Bluerig/demo/   the clickable demo (made-up shop, no backend)
name: Demo on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run demo
      - run: node demo/build-landing.mjs
      - run: mkdir -p _site/demo && cp dist/landing.html _site/index.html && cp dist/demo.html _site/demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
